#####-----神经网络参数-----#####
yolo_name: "yolov5"
yolo_type: "yolov5"
classify_model: "assets/tiny_resnet.engine"
yolo11_model_path: "assets/yolo11.xml"
yolov8_model_path: "assets/yolov8.engine"
yolov5_model_path: "assets/yolov5.engine" 
device: "GPU"
min_confidence: 0.8
use_traditional: false  # 用原生 bool 类型

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 10
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree -2.5
pitch_offset: 0 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.15 # s
low_speed_delay_time: 0.15 # s

#####-----shooter参数-----#####
first_tolerance: 2 # 近距离射击容差，degree
second_tolerance: 1 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

